[workspace]
members = ["crates/rusty-core", "crates/rusty-cli", "crates/rusty-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gif = "0.14"
ab_glyph = "0.2"
fastrand = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
